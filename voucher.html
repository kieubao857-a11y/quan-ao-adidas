<body>

    <header class="header">

        <div class="logo">

        <nav class="menu">

    <main class="voucher-page">

        <h1>🎁 VÒNG QUAY MAY MẮN</h1>

        <p class="voucher-description">
            Quay vòng quay để nhận voucher giảm giá
        </p>


        <div class="voucher-wheel-box">

            <div class="voucher-pointer">
                ▼
            </div>

            <svg
                class="voucher-wheel-svg"
                viewBox="0 0 500 500"
                xmlns="http://www.w3.org/2000/svg"
            >

                <g id="wheelGroup">

                    <!-- Ô 1 -->
                    <path
                        class="voucher-sector"
                        d="M 250 250 L 250 20 A 230 230 0 0 1 412.63 87.37 Z">
                    </path>

                    <!-- Ô 2 -->
                    <path
                        class="voucher-sector"
                        d="M 250 250 L 412.63 87.37 A 230 230 0 0 1 480 250 Z">
                    </path>

                    <!-- Ô 3 -->
                    <path
                        class="voucher-sector"
                        d="M 250 250 L 480 250 A 230 230 0 0 1 412.63 412.63 Z">
                    </path>

                    <!-- Ô 4 -->
                    <path
                        class="voucher-sector"
                        d="M 250 250 L 412.63 412.63 A 230 230 0 0 1 250 480 Z">
                    </path>

                    <!-- Ô 5 -->
                    <path
                        class="voucher-sector"
                        d="M 250 250 L 250 480 A 230 230 0 0 1 87.37 412.63 Z">
                    </path>

                    <!-- Ô 6 -->
                    <path
                        class="voucher-sector"
                        d="M 250 250 L 87.37 412.63 A 230 230 0 0 1 20 250 Z">
                    </path>

                    <!-- Ô 7 -->
                    <path
                        class="voucher-sector"
                        d="M 250 250 L 20 250 A 230 230 0 0 1 87.37 87.37 Z">
                    </path>

                    <!-- Ô 8 -->
                    <path
                        class="voucher-sector"
                        d="M 250 250 L 87.37 87.37 A 230 230 0 0 1 250 20 Z">
                    </path>


                    <!-- CHỮ 8 Ô -->

                    <text
                        class="voucher-sector-text"
                        x="305.5"
                        y="116"
                    >
                        10% OFF
                    </text>

                    <text
                        class="voucher-sector-text"
                        x="383.9"
                        y="194.6"
                    >
                        15% OFF
                    </text>

                    <text
                        class="voucher-sector-text"
                        x="383.9"
                        y="305.4"
                    >
                        20% OFF
                    </text>

                    <text
                        class="voucher-sector-text"
                        x="305.5"
                        y="384"
                    >
                        25% OFF
                    </text>

                    <text
                        class="voucher-sector-text"
                        x="194.5"
                        y="384"
                    >
                        FREESHIP
                    </text>

                    <text
                        class="voucher-sector-text"
                        x="116.1"
                        y="305.4"
                    >
                        10% OFF
                    </text>

                    <text
                        class="voucher-sector-text"
                        x="116.1"
                        y="194.6"
                    >
                        15% OFF
                    </text>

                    <text
                        class="voucher-sector-text"
                        x="194.5"
                        y="116"
                    >
                        20% OFF
                    </text>

                </g>


                <!-- VÒNG TRÒN NGOÀI -->
                <circle
                    cx="250"
                    cy="250"
                    r="230"
                    class="voucher-wheel-border">
                </circle>


                <!-- NÚT GIỮA -->
                <circle
                    cx="250"
                    cy="250"
                    r="48"
                    class="voucher-center">
                </circle>

                <text
                    x="250"
                    y="250"
                    class="voucher-center-text">
                    QUAY
                </text>

            </svg>

        </div>


        <button
            id="spinButton"
            class="voucher-spin-button">
            🎯 QUAY NGAY
        </button>


        <div
            id="voucherResult"
            class="voucher-result">
        </div>
