<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Adidas - Danh sách sản phẩm
    </title>


    <style>

        /* =====================================
           RESET
        ===================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================
           BODY
        ===================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #ffffff;

            color: #111111;

        }


        a {

            text-decoration: none;

            color: inherit;

        }


        /* =====================================
           HEADER
        ===================================== */

        .site-header {

            width: 100%;

            min-height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 4%;

            background: #ffffff;

            border-bottom:
                1px solid
                #eeeeee;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        /* LOGO */

        .logo {

            font-size: 24px;

            font-weight: 900;

            letter-spacing: 2px;

        }


        /* MENU */

        .site-header nav {

            display: flex;

            gap: 30px;

        }


        .site-header nav a {

            font-size: 14px;

            font-weight: 600;

            transition:
                color
                0.2s
                ease;

        }


        .site-header nav a:hover {

            color: #e30613;

        }


        /* =====================================
           CONTAINER
        ===================================== */

        .container {

            width: min(1200px, 92%);

            margin: 0 auto;

            padding:
                45px
                0
                70px;

        }


        /* =====================================
           TIÊU ĐỀ
        ===================================== */

        .section-title {

            margin-bottom: 25px;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: 0.5px;

        }


        /* =====================================
           BỘ LỌC
        ===================================== */

        .filter-box {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-bottom: 35px;

            padding: 18px;

            background: #f5f5f5;

        }


        .filter-box input,
        .filter-box select {

            height: 44px;

            border:
                1px solid
                #cccccc;

            background: #ffffff;

            padding:
                0
                13px;

            font-size: 14px;

            outline: none;

        }


        .filter-box input:focus,
        .filter-box select:focus {

            border-color: #111111;

        }


        /* Ô tìm kiếm */

        #searchInput {

            flex:
                1
                1
                280px;

        }


        /* Select danh mục */

        #categoryFilter {

            flex:
                0
                1
                190px;

        }


        /* Giá */

        #minPrice,
        #maxPrice {

            flex:
                0
                1
                140px;

        }


        /* =====================================
           PRODUCT GRID
        ===================================== */

        .product-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap: 24px;

        }


        /* =====================================
           PRODUCT CARD
        ===================================== */

        .product-card {

            overflow: hidden;

            border:
                1px solid
                #e5e5e5;

            background: #ffffff;

            transition:
                transform
                0.2s
                ease,

                box-shadow
                0.2s
                ease;

        }


        .product-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 8px 24px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

        }


        /* =====================================
           HÌNH ẢNH
        ===================================== */

        .product-image {

            display: block;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #f4f4f4;

        }


        .product-image img {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: cover;

            transition:
                transform
                0.3s
                ease;

        }


        .product-card:hover
        .product-image img {

            transform:
                scale(1.04);

        }


        /* =====================================
           THÔNG TIN SẢN PHẨM
        ===================================== */

        .product-info {

            padding: 16px;

        }


        /* Danh mục */

        .product-category {

            margin-bottom: 7px;

            color: #777777;

            font-size: 12px;

            text-transform: uppercase;

        }


        /* Tên sản phẩm */

        .product-name {

            min-height: 44px;

            margin-bottom: 10px;

            font-size: 16px;

            line-height: 1.4;

        }


        /* Giá */

        .product-price {

            margin-bottom: 15px;

            font-size: 16px;

            font-weight: 700;

        }


        /* =====================================
           NÚT XEM CHI TIẾT
        ===================================== */

        .product-button {

            display: block;

            padding:
                11px
                12px;

            background: #111111;

            color: #ffffff;

            font-size: 13px;

            font-weight: 700;

            text-align: center;

            text-transform: uppercase;

            transition:
                background
                0.2s
                ease;

        }


        .product-button:hover {

            background: #e30613;

        }


        /* =====================================
           LOADING / EMPTY / ERROR
        ===================================== */

        .loading-message,
        .empty-message,
        .error-message {

            grid-column:
                1 / -1;

            padding:
                50px
                20px;

            background: #f7f7f7;

            text-align: center;

        }


        .empty-message h3,
        .error-message h3 {

            margin-bottom: 8px;

        }


        .empty-message p,
        .error-message p {

            color: #666666;

        }


        .error-message h3 {

            color: #cc0000;

        }


        .error-note {

            margin-top: 8px;

            font-size: 13px;

        }


        /* =====================================
           TABLET
        ===================================== */

        @media (max-width: 1000px) {

            .product-grid {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            .container {

                width: 94%;

                padding-top: 30px;

            }


            .section-title {

                font-size: 25px;

            }


            .product-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 15px;

            }


            .filter-box input,
            .filter-box select {

                width: 100%;

                flex-basis: 100%;

            }


            /* HEADER MOBILE */

            .site-header {

                padding:
                    0
                    20px;

            }


            .logo {

                font-size: 20px;

            }


            .site-header nav {

                gap: 15px;

            }


            .site-header nav a {

                font-size: 13px;

            }

        }


        /* =====================================
           ĐIỆN THOẠI NHỎ
        ===================================== */

        @media (max-width: 450px) {

            .product-grid {

                grid-template-columns:
                    1fr;

            }


            .site-header {

                min-height: 60px;

            }


            .logo {

                font-size: 18px;

            }


            .site-header nav {

                gap: 10px;

            }


            .site-header nav a {

                font-size: 12px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         HEADER
    ===================================== -->

    <header class="site-header">


        <!-- LOGO -->

        <a
            href="index.html"
            class="logo"
        >
            ADIDAS
        </a>


        <!-- MENU -->

        <nav>

            <a href="index.html">
                Trang chủ
            </a>

            <a href="product.html">
                Sản phẩm
            </a>

        </nav>


    </header>



    <!-- =====================================
         DANH SÁCH SẢN PHẨM
    ===================================== -->

    <section class="container">


        <!-- TIÊU ĐỀ -->

        <h2 class="section-title">

            DANH SÁCH SẢN PHẨM

        </h2>



        <!-- =================================
             BỘ LỌC
        ================================== -->

        <div class="filter-box">


            <!-- TÌM KIẾM -->

            <input
                type="text"
                id="searchInput"
                placeholder="Tìm kiếm sản phẩm..."
                autocomplete="off"
            >



            <!-- DANH MỤC -->

            <select id="categoryFilter">

                <option value="all">
                    Tất cả danh mục
                </option>

                <option value="Áo">
                    Áo
                </option>

                <option value="Quần">
                    Quần
                </option>

                <option value="Áo khoác">
                    Áo khoác
                </option>

                <option value="Giày">
                    Giày
                </option>

            </select>



            <!-- GIÁ TỪ -->

            <input
                type="number"
                id="minPrice"
                placeholder="Giá từ"
                min="0"
                step="10000"
            >



            <!-- GIÁ ĐẾN -->

            <input
                type="number"
                id="maxPrice"
                placeholder="Giá đến"
                min="0"
                step="10000"
            >

        </div>



        <!-- =================================
             DANH SÁCH SẢN PHẨM
        ================================== -->

        <div
            id="productList"
            class="product-grid"
        >

            <div class="loading-message">

                Đang tải sản phẩm...

            </div>

        </div>


    </section>



    <!-- =====================================
         JAVASCRIPT
    ===================================== -->

    <script
        type="module"
        src="./js/products.js"
    ></script>


</body>

</html>
