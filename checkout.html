<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thanh toán</title>

    <link rel="stylesheet" href="./src/style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            adidas
        </div>

        <nav class="menu">

            <a href="index.html">
                Trang chủ
            </a>

            <a href="product.html">
                Sản phẩm
            </a>

            <a href="#">
                Nam
            </a>

            <a href="#">
                Nữ
            </a>

            <a href="#">
                Thể thao
            </a>

            <a href="#">
                Sale
            </a>

        </nav>

        <div class="header-right">

            <a href="cart.html" class="icon">
                🛒
            </a>

            <a href="#" class="icon">
                👤
            </a>

        </div>

    </header>


    <!-- THANH TOÁN -->

    <main class="container">

        <h1>
            Thanh toán
        </h1>


        <form id="checkoutForm">

            <!-- THÔNG TIN NGƯỜI NHẬN -->

            <h2>
                Thông tin người nhận
            </h2>


            <div class="form-group">

                <label for="name">
                    Họ và tên
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Nhập họ và tên"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Số điện thoại
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Nhập số điện thoại"
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Địa chỉ
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Nhập địa chỉ nhận hàng"
                >

            </div>


            <!-- PHƯƠNG THỨC THANH TOÁN -->

            <h2>
                Phương thức thanh toán
            </h2>


            <div class="payment-method">

                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="cod"
                    >

                    Thanh toán khi nhận hàng

                </label>


                <br>


                <label>

                    <input
                        type="radio"
                        name="payment"
                        value="bank"
                    >

                    Chuyển khoản ngân hàng

                </label>

            </div>


            <br>


            <button
                type="submit"
                class="btn"
            >
                ĐẶT HÀNG
            </button>

        </form>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Adidas
        </p>

    </footer>


    <script src="./js/checkout.js"></script>

</body>

</html>
